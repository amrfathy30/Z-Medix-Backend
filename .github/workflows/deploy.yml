name: Deploy Z Medix API

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Laravel API to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Filament theme imports CSS from vendor/,
      # so Composer packages must exist before the Vite build.
      - name: Install Composer dependencies
        run: composer install --no-dev --no-scripts --no-interaction --prefer-dist --ignore-platform-reqs

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: 22
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 60s
          command_timeout: 20m
          script: |
            whoami
            hostname

            cd /var/www/zmedix-backend

            ./deploy.sh

            php artisan migrate --force

            # Seed countries/world data.
            # WorldSeeder is expected to be safe/idempotent and should skip
            # reseeding when the countries table is already populated.
            php artisan db:seed --class=WorldSeeder --force

            # Create/update the admin permissions and roles. New permissions
            # (e.g. plans.*, subscriptions.*) only exist after this runs, and a
            # policy checking a missing permission makes the dashboard return 500.
            # It re-syncs the admin and content_manager roles to the lists in
            # RolesPermissionsSeeder on every deploy, so permission changes made
            # to those two roles from the dashboard are reset.
            php artisan db:seed --class=RolesPermissionsSeeder --force

            # Create the Basic/Premium/Ultra plans. Idempotent: only creates a
            # plan whose slug is missing, never overwrites edited prices or features.
            php artisan db:seed --class=PlansSeeder --force

            # Seed the demo Fellowship question banks.
            # FellowshipSeeder is idempotent and refuses to run when
            # APP_ENV=production.
            php artisan db:seed --class=FellowshipSeeder --force

            # public/storage is git-ignored, so it must be recreated
            # on the server or uploaded files may return 403.
            php artisan storage:link --force

            # Clear cached configuration/routes/views after deployment.
            php artisan optimize:clear

            # Artisan runs as the SSH user, so cache/log files it creates
            # must be writable by the web server user.
            chmod -R a+rwX storage bootstrap/cache 2>/dev/null || true

      - name: Upload built assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: 22
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: public/build/*
          target: /var/www/zmedix-backend/public/build
          strip_components: 2
          rm: true
