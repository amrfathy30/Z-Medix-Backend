name: Deploy Z Medix API

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Laravel API to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Filament theme imports CSS from vendor/, so Composer packages must exist before the Vite build.
      - name: Install Composer dependencies
        run: composer install --no-dev --no-scripts --no-interaction --prefer-dist --ignore-platform-reqs

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: 22
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 60s
          command_timeout: 20m
          script: |
            whoami
            hostname
            cd /var/www/zmedix-backend
            ./deploy.sh

      - name: Upload built assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: 22
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: public/build/*
          target: /var/www/zmedix-backend/public/build
          strip_components: 2
          rm: true
