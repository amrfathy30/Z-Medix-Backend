
name: Staging Queue

on:
  workflow_dispatch:
    inputs:
      action:
        description: Queue worker action
        required: true
        default: status
        type: choice
        options:
          - status
          - start
          - restart
          - stop
          - run-once

permissions: {}

concurrency:
  group: zmedix-staging-services
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15

    steps:
      - name: Manage staging Queue Worker
        uses: appleboy/ssh-action@v1.0.3
        env:
          ACTION: ${{ inputs.action }}
          APP_PATH: ${{ vars.STAGING_APP_PATH || '/var/www/zmedix-backend' }}
          PHP_BIN: ${{ vars.STAGING_PHP_BIN || 'php' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ vars.STAGING_SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 12m
          envs: ACTION,APP_PATH,PHP_BIN
          script: |
            bash -se <<'REMOTE'
            set -euo pipefail

            fail() { echo "ERROR: $*" >&2; exit 1; }

            root() {
              if [ "$(id -u)" -eq 0 ]; then
                "$@"
              else
                sudo -n "$@"
              fi
            }

            cd "$APP_PATH" || fail "Application path missing"

            PHP_BIN="$(command -v "$PHP_BIN")" ||
              fail "PHP not available"

            "$PHP_BIN" -r '
              require "vendor/autoload.php";
              $app = require "bootstrap/app.php";
              $app->make(
                Illuminate\Contracts\Console\Kernel::class
              )->bootstrap();

              if (! $app->environment("staging")) {
                fwrite(STDERR, "APP_ENV must be staging\n");
                exit(1);
              }
            '

            command -v supervisorctl >/dev/null ||
              fail "Run Staging Setup first"

            PROGRAM="zmedix-queue"

            get_status() {
              root supervisorctl status "$PROGRAM" 2>&1 || true
            }

            echo "=== Z-MEDIX QUEUE ==="
            echo "Action: $ACTION"
            echo "Server: $(hostname)"
            echo "Application: $APP_PATH"

            case "$ACTION" in
              status)
                get_status
                ;;

              start)
                STATUS="$(get_status)"

                if [[ "$STATUS" == *RUNNING* ]]; then
                  echo "Worker already running"
                else
                  root supervisorctl start "$PROGRAM"
                fi
                ;;

              restart)
                STATUS="$(get_status)"

                if [[ "$STATUS" == *RUNNING* ]]; then
                  root supervisorctl restart "$PROGRAM"
                else
                  root supervisorctl start "$PROGRAM"
                fi
                ;;

              stop)
                STATUS="$(get_status)"

                if [[ "$STATUS" == *RUNNING* ]]; then
                  root supervisorctl stop "$PROGRAM"
                else
                  echo "Worker already stopped"
                fi
                ;;

              run-once)
                echo "Processing at most one queued job"

                SETTINGS="$("$PHP_BIN" -r '
                  require "vendor/autoload.php";
                  $app = require "bootstrap/app.php";
                  $app->make(
                    Illuminate\Contracts\Console\Kernel::class
                  )->bootstrap();

                  $connection = config("queue.default");

                  if (! in_array(config(
                    "queue.connections.{$connection}.driver"
                  ), ["database", "redis"], true)) {
                    exit(1);
                  }

                  $queues = array_unique([
                    config("queue.connections.{$connection}.queue"),
                    config("ai_chat.queue")
                  ]);

                  if (config("ai_chat.queue_connection") !== $connection) {
                    exit(1);
                  }

                  foreach ($queues as $queue) {
                    if (! is_string($queue) ||
                        ! preg_match("/^[a-zA-Z0-9_.-]+$/", $queue)) {
                      exit(1);
                    }
                  }

                  echo $connection . "|" . implode(",", $queues);
                ')" || fail "Invalid queue configuration"

                IFS='|' read -r CONNECTION QUEUES <<< "$SETTINGS"

                timeout --signal=TERM --kill-after=15s 90s \
                  "$PHP_BIN" artisan queue:work "$CONNECTION" \
                  --queue="$QUEUES" \
                  --once \
                  --tries=3 \
                  --timeout=60 \
                  --memory=256 \
                  --no-interaction
                ;;

              *)
                fail "Invalid action"
                ;;
            esac

            echo ""
            echo "=== WORKER STATUS ==="
            STATUS="$(get_status)"
            echo "$STATUS"

            if [[ "$ACTION" == start || "$ACTION" == restart ]]; then
              [[ "$STATUS" == *RUNNING* ]] ||
                fail "Queue Worker is not RUNNING"
            fi

            echo ""
            echo "=== RECENT WORKER LOGS ==="

            if [ -f storage/logs/zmedix-queue.log ]; then
              tail -n 20 storage/logs/zmedix-queue.log
            fi

            echo ""
            echo "=== FAILED JOBS ==="
            "$PHP_BIN" artisan queue:failed || true

            echo "Queue operation complete"
            REMOTE
