
name: Check and Install PDFInfo

on:
  workflow_dispatch:

jobs:
  install-pdfinfo:
    name: Check PDFInfo on Z-Medix Server
    runs-on: ubuntu-latest

    steps:
      - name: Check and Install PDFInfo using SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: 22
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            set -eu

            echo "=== Server Information ==="
            whoami
            hostname

            echo "=== Checking PDFInfo ==="

            if command -v pdfinfo >/dev/null 2>&1; then
              echo "PDFInfo is already installed."
            else
              echo "PDFInfo not found. Installing poppler-utils..."

              if ! command -v apt-get >/dev/null 2>&1; then
                echo "ERROR: apt-get not found. Ubuntu/Debian required."
                exit 1
              fi

              if [ "$(id -u)" -eq 0 ]; then
                apt-get update
                DEBIAN_FRONTEND=noninteractive apt-get install -y poppler-utils
              else
                sudo -n apt-get update
                sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y poppler-utils
              fi
            fi

            echo "=== Final Verification ==="

            if ! command -v pdfinfo >/dev/null 2>&1; then
              echo "ERROR: PDFInfo installation failed."
              exit 1
            fi

            command -v pdfinfo
            pdfinfo -v

            echo "SUCCESS: PDFInfo is ready."
