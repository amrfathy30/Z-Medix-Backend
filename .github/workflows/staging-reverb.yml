
name: Staging Reverb

on:
  workflow_dispatch:
    inputs:
      action:
        description: Reverb service action
        required: true
        default: status
        type: choice
        options:
          - status
          - configure-and-start
          - restart
          - stop

permissions: {}

concurrency:
  group: zmedix-staging-services
  cancel-in-progress: false

jobs:
  reverb:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20

    steps:
      - name: Configure and manage Reverb
        uses: appleboy/ssh-action@v1.0.3
        env:
          ACTION: ${{ inputs.action }}
          APP_PATH: ${{ vars.STAGING_APP_PATH || '/var/www/zmedix-backend' }}
          PHP_BIN: ${{ vars.STAGING_PHP_BIN || 'php' }}
          REVERB_PORT: ${{ vars.STAGING_REVERB_INTERNAL_PORT || '8081' }}
          WS_HOST: zmedixapi.pulvent.com
          WS_ORIGINS: ${{ vars.STAGING_REVERB_ORIGINS }}
          NGINX_SITE: ${{ vars.STAGING_NGINX_SITE }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ vars.STAGING_SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 15m
          envs: ACTION,APP_PATH,PHP_BIN,REVERB_PORT,WS_HOST,WS_ORIGINS,NGINX_SITE
          script: |
            bash -se <<'REMOTE'
            set -euo pipefail

            fail() { echo "ERROR: $*" >&2; exit 1; }

            root() {
              if [ "$(id -u)" -eq 0 ]; then
                "$@"
              else
                sudo -n "$@"
              fi
            }

            cd "$APP_PATH" || fail "Application directory missing"

            PHP_BIN="$(command -v "$PHP_BIN")" ||
              fail "PHP executable not found"

            "$PHP_BIN" -r '
              require "vendor/autoload.php";
              $app = require "bootstrap/app.php";
              $app->make(
                Illuminate\Contracts\Console\Kernel::class
              )->bootstrap();

              if (! $app->environment("local")) {
                fwrite(STDERR, "APP_ENV must be local\n");
                exit(1);
              }

              if (! class_exists(
                Laravel\Reverb\ReverbServiceProvider::class
              )) {
                fwrite(STDERR, "Laravel Reverb missing\n");
                exit(1);
              }
            '

            command -v supervisorctl >/dev/null ||
              fail "Run Staging Setup first"

            PROGRAM="zmedix-reverb"

            get_status() {
              root supervisorctl status "$PROGRAM" 2>&1 || true
            }

            validate_settings() {
              [[ "$REVERB_PORT" =~ ^[0-9]+$ ]] ||
                fail "Invalid Reverb port"

              (( REVERB_PORT >= 1 && REVERB_PORT <= 65535 )) ||
                fail "Invalid Reverb port"

              [[ "$WS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] ||
                fail "Set STAGING_WS_HOST to the HTTPS hostname"

              [[ -n "$WS_ORIGINS" ]] ||
                fail "Set STAGING_REVERB_ORIGINS"

              [[ "$WS_ORIGINS" =~ ^[a-zA-Z0-9.,:-]+$ ]] ||
                fail "Use comma-separated origin hostnames only"

              [[ "$WS_ORIGINS" != *"*"* ]] ||
                fail "Wildcard origins are not allowed"
            }

            configure_env() {
              echo "Backing up and configuring .env"

              python3 - "$REVERB_PORT" "$WS_ORIGINS" <<'PYTHON'
            import os
            import pathlib
            import secrets
            import shutil
            import sys
            import tempfile
            from datetime import datetime, timezone

            port, origins = sys.argv[1:]
            path = pathlib.Path(".env")

            if not path.is_file():
                sys.exit("ERROR: .env not found")

            original = path.read_text()
            stat = path.stat()

            values = {}
            lines = original.splitlines()

            for line in lines:
                if "=" in line and not line.lstrip().startswith("#"):
                    key, value = line.split("=", 1)
                    values[key.strip()] = value.strip().strip("\"'")

            def credential(name, generator):
                return values.get(name) or generator()

            app_id = credential(
                "REVERB_APP_ID",
                lambda: str(secrets.randbelow(90000000) + 10000000)
            )
            app_key = credential(
                "REVERB_APP_KEY",
                lambda: secrets.token_hex(16)
            )
            app_secret = credential(
                "REVERB_APP_SECRET",
                lambda: secrets.token_hex(32)
            )

            updates = {
                "BROADCAST_CONNECTION": "reverb",
                "REVERB_APP_ID": app_id,
                "REVERB_APP_KEY": app_key,
                "REVERB_APP_SECRET": app_secret,
                "REVERB_SERVER_HOST": "127.0.0.1",
                "REVERB_SERVER_PORT": port,
                "REVERB_HOST": "127.0.0.1",
                "REVERB_PORT": port,
                "REVERB_SCHEME": "http",
                "REVERB_ALLOWED_ORIGINS": origins,
            }

            existing = set()
            result = []

            for line in lines:
                if "=" in line and not line.lstrip().startswith("#"):
                    key = line.split("=", 1)[0].strip()

                    if key in updates:
                        if key not in existing:
                            result.append(f"{key}={updates[key]}")
                            existing.add(key)
                        continue

                result.append(line)

            for key, value in updates.items():
                if key not in existing:
                    result.append(f"{key}={value}")

            backup = pathlib.Path(
                ".env.reverb-backup-" +
                datetime.now(timezone.utc).strftime("%Y%m%d%H%M%S%f")
            )

            shutil.copy2(path, backup)
            os.chmod(backup, 0o600)

            fd, temp = tempfile.mkstemp(
                prefix=".env.reverb-",
                dir="."
            )

            try:
                with os.fdopen(fd, "w") as handle:
                    handle.write("\n".join(result) + "\n")
                    handle.flush()
                    os.fsync(handle.fileno())

                os.chmod(temp, stat.st_mode & 0o777)
                os.chown(temp, stat.st_uid, stat.st_gid)
                os.replace(temp, path)
            finally:
                if os.path.exists(temp):
                    os.unlink(temp)

            print("Reverb .env updated; protected backup created")
            PYTHON

              "$PHP_BIN" artisan optimize:clear
            }

            validate_reverb_config() {
              "$PHP_BIN" -r '
                require "vendor/autoload.php";
                $app = require "bootstrap/app.php";
                $app->make(
                  Illuminate\Contracts\Console\Kernel::class
                )->bootstrap();

                if (config("broadcasting.default") !== "reverb") {
                  fwrite(STDERR, "Broadcast driver is not reverb\n");
                  exit(1);
                }

                foreach (["app_id", "key", "secret"] as $field) {
                  if (! filled(
                    config("reverb.apps.apps.0.{$field}")
                  )) {
                    fwrite(STDERR, "Missing Reverb credentials\n");
                    exit(1);
                  }
                }

                if (config("reverb.servers.reverb.host") !== "127.0.0.1") {
                  fwrite(STDERR, "Invalid Reverb bind host\n");
                  exit(1);
                }
              '
            }

            configure_nginx() {
              [[ -n "$NGINX_SITE" ]] ||
                fail "Set STAGING_NGINX_SITE"

              [[ "$NGINX_SITE" == /etc/nginx/* ]] ||
                fail "NGINX_SITE must be under /etc/nginx"

              root test -f "$NGINX_SITE" ||
                fail "Nginx site file missing"

              command -v nginx >/dev/null ||
                fail "Nginx not installed"

              root mkdir -p /etc/nginx/snippets

              SNIPPET="/etc/nginx/snippets/zmedix-reverb.conf"

              if root test -e "$SNIPPET"; then
                root grep -q 'zmedix-managed-reverb-v1' "$SNIPPET" ||
                  fail "Existing Reverb snippet is not managed by this workflow"
              fi

              root tee "$SNIPPET" >/dev/null <<EOF
            # zmedix-managed-reverb-v1
            location ^~ /app/ {
                proxy_pass http://127.0.0.1:${REVERB_PORT};
                proxy_http_version 1.1;
                proxy_set_header Host \$host;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto \$scheme;
                proxy_set_header Upgrade \$http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
            }

            location ^~ /apps/ {
                proxy_pass http://127.0.0.1:${REVERB_PORT};
                proxy_http_version 1.1;
                proxy_set_header Host \$host;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto \$scheme;
                proxy_read_timeout 60s;
            }
            EOF

              root python3 - "$NGINX_SITE" "$WS_HOST" "$SNIPPET" <<'PYTHON'
            import pathlib
            import re
            import shutil
            import sys
            from datetime import datetime, timezone

            site = pathlib.Path(sys.argv[1])
            domain = sys.argv[2]
            snippet = sys.argv[3]
            include = f"include {snippet};"

            original = site.read_text()

            if include in original:
                print("Nginx Reverb include already exists")
                sys.exit(0)

            lines = original.splitlines(keepends=True)
            depth = 0
            in_server = False
            start = 0
            matches = []

            for index, line in enumerate(lines):
                clean = line.split("#", 1)[0]

                if depth == 0 and re.match(
                    r"^\s*server\s*\{", clean
                ):
                    in_server = True
                    start = index

                depth += clean.count("{") - clean.count("}")

                if in_server and depth == 0:
                    block = "".join(lines[start:index + 1])

                    names = re.findall(
                        r"server_name\s+([^;]+);", block
                    )

                    host_match = any(
                        domain in group.split()
                        for group in names
                    )

                    tls = bool(re.search(
                        r"listen\s+[^;]*\b443\b", block
                    ))

                    if host_match and tls:
                        if re.search(
                            r"location\s+(?:\^~\s*)?/apps?/",
                            block
                        ):
                            sys.exit(
                                "ERROR: Existing WebSocket locations need manual review"
                            )

                        matches.append(index)

                    in_server = False

            if len(matches) != 1:
                sys.exit(
                    "ERROR: Expected exactly one matching HTTPS "
                    "server block for the staging WebSocket host"
                )

            index = matches[0]

            backup = pathlib.Path(
                str(site) + ".zmedix-backup-" +
                datetime.now(timezone.utc).strftime("%Y%m%d%H%M%S%f")
            )

            shutil.copy2(site, backup)

            lines.insert(
                index,
                "    " + include + "\n"
            )

            site.write_text("".join(lines))
            print(f"Nginx site backup: {backup}")
            PYTHON

              if ! root nginx -t; then
                echo "Nginx validation failed. Restore the site backup."
                fail "Nginx configuration invalid; reload skipped"
              fi

              root systemctl reload nginx
              echo "Nginx configuration reloaded"
            }

            start_reverb() {
              STATUS="$(get_status)"

              if [[ "$STATUS" == *RUNNING* ]]; then
                root supervisorctl restart "$PROGRAM"
              else
                root supervisorctl start "$PROGRAM"
              fi
            }

            check_local() {
              "$PHP_BIN" -r '
                $host = "127.0.0.1";
                $port = (int) $argv[1];

                $socket = @stream_socket_client(
                  "tcp://{$host}:{$port}",
                  $errno, $error, 5
                );

                if (! $socket) {
                  fwrite(STDERR, "Reverb local port unavailable\n");
                  exit(1);
                }

                fclose($socket);
                echo "Reverb local port reachable\n";
              ' "$REVERB_PORT"
            }

            print_frontend_and_verify() {
              validate_reverb_config

              KEY="$("$PHP_BIN" -r '
                require "vendor/autoload.php";
                $app = require "bootstrap/app.php";
                $app->make(
                  Illuminate\Contracts\Console\Kernel::class
                )->bootstrap();

                echo config("reverb.apps.apps.0.key");
              ')"

              echo "Verifying HTTPS WebSocket handshake"

              CODE="$(curl --silent --show-error \
                --http1.1 \
                --max-time 15 \
                --output /dev/null \
                --write-out '%{http_code}' \
                --header 'Connection: Upgrade' \
                --header 'Upgrade: websocket' \
                --header 'Sec-WebSocket-Version: 13' \
                --header 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' \
                "https://${WS_HOST}/app/${KEY}?protocol=7&client=js&version=8.4.0")" ||
                fail "Public WebSocket connection failed"

              [[ "$CODE" == 101 ]] ||
                fail "Public WSS handshake returned HTTP $CODE"

              echo ""
              echo "======================================"
              echo "FRONTEND REVERB CONFIGURATION"
              echo "======================================"
              echo "REVERB_APP_KEY=$KEY"
              echo "REVERB_HOST=$WS_HOST"
              echo "REVERB_PORT=443"
              echo "REVERB_SCHEME=https"
              echo "BROADCAST_AUTH_PATH=/api/student/broadcasting/auth"
              echo "PRIVATE_CHANNEL=student.ai.conversation.{conversationId}"
              echo "WEBSOCKET_HANDSHAKE=101"
              echo "======================================"
              echo "Do not send REVERB_APP_SECRET to frontend"
            }

            echo "=== Z-MEDIX REVERB ==="
            echo "Action: $ACTION"
            echo "Server: $(hostname)"

            case "$ACTION" in
              configure-and-start)
                validate_settings
                configure_env
                validate_reverb_config
                configure_nginx
                start_reverb
                ;;

              restart)
                validate_settings
                start_reverb
                ;;

              status)
                echo "$(get_status)"
                ;;

              stop)
                STATUS="$(get_status)"

                if [[ "$STATUS" == *RUNNING* ]]; then
                  root supervisorctl stop "$PROGRAM"
                else
                  echo "Reverb already stopped"
                fi
                ;;

              *)
                fail "Invalid action"
                ;;
            esac

            STATUS="$(get_status)"
            echo "Supervisor: $STATUS"

            if [[ "$ACTION" == configure-and-start ||
                  "$ACTION" == restart ||
                  ( "$ACTION" == status && "$STATUS" == *RUNNING* ) ]]; then

              [[ "$STATUS" == *RUNNING* ]] ||
                fail "Reverb is not running"

              validate_settings
              check_local
              print_frontend_and_verify
            fi

            echo "Reverb operation complete"
            REMOTE
