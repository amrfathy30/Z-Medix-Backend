
name: Staging Reverb

on:
  workflow_dispatch:
    inputs:
      action:
        description: Reverb service action
        required: true
        default: status
        type: choice
        options:
          - status
          - inspect
          - configure-and-start
          - restart
          - stop

permissions: {}

concurrency:
  group: zmedix-staging-services
  cancel-in-progress: false

jobs:
  reverb:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - name: Manage Z-Medix Reverb
        uses: appleboy/ssh-action@v1.0.3
        env:
          ACTION: ${{ inputs.action }}
          APP_PATH: /var/www/zmedix-backend
          REVERB_PORT: '8082'
          WS_HOST: zmedixapi.pulvent.com
          WS_ORIGINS: zmedixadmin.pulvent.com,localhost,127.0.0.1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ vars.STAGING_SSH_PORT || 22 }}
          command_timeout: 15m
          envs: ACTION,APP_PATH,REVERB_PORT,WS_HOST,WS_ORIGINS
          script: |
            bash -se <<'REMOTE'
            set -euo pipefail

            fail() { echo "ERROR: $*" >&2; exit 1; }
            root() {
              if [ "$(id -u)" -eq 0 ]; then "$@"; else sudo -n "$@"; fi
            }
            status() { root supervisorctl status zmedix-reverb 2>&1 || true; }
            running() { [[ "$(status)" == *RUNNING* ]]; }
            PHP_BIN="$(command -v php8.4 || command -v php)" || fail 'PHP missing'
            cd "$APP_PATH" || fail 'Z-Medix directory missing'
            test -f artisan && test -f vendor/autoload.php || fail 'Laravel deployment missing'
            command -v supervisorctl >/dev/null || fail 'Supervisor missing'

            "$PHP_BIN" -r '
              require "vendor/autoload.php";
              $app = require "bootstrap/app.php";
              $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              if (! $app->environment("local")) { fwrite(STDERR, "APP_ENV must be local\n"); exit(1); }
              if (! class_exists(Laravel\Reverb\ReverbServiceProvider::class)) { exit(1); }
            ' || fail 'Wrong environment or Reverb package missing'

            diagnose() {
              echo '=== Z-MEDIX SUPERVISOR ==='
              status
              root grep -E '^(command|directory|user|stdout_logfile)=' /etc/supervisor/conf.d/zmedix-reverb.conf || true
              echo '=== REVERB LOG ==='
              root tail -n 35 "$APP_PATH/storage/logs/zmedix-reverb.log" 2>&1 || true
              echo '=== PORT ==='
              root ss -ltnp "( sport = :$REVERB_PORT )" || true
              echo '=== ENV (NON-SECRET) ==='
              "$PHP_BIN" -r '
                require "vendor/autoload.php";
                $app = require "bootstrap/app.php";
                $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
                echo "broadcast=".config("broadcasting.default")."\n";
                echo "server_port=".config("reverb.servers.reverb.port")."\n";
              ' || true
            }

            preflight() {
              [[ "$REVERB_PORT" =~ ^[0-9]+$ ]] || fail 'Invalid port'
              # Never replace or kill another service using this port.
              if root ss -ltnH "( sport = :$REVERB_PORT )" | grep -q .; then
                if ! running; then
                  fail "Port $REVERB_PORT is occupied; refusing to touch the owner"
                fi
              fi
              root test -f /etc/nginx/sites-available/zmedixapi.pulvent.com || fail 'Z-Medix Nginx site missing'
              root test -f /etc/supervisor/conf.d/zmedix-reverb.conf || fail 'Z-Medix Supervisor config missing'
              root nginx -t || fail 'Existing Nginx configuration invalid'
            }

            configure_env() {
              python3 - "$REVERB_PORT" "$WS_ORIGINS" <<'PY'
            import os, pathlib, secrets, shutil, sys, tempfile
            from datetime import datetime, timezone
            port, origins = sys.argv[1:]
            path = pathlib.Path('.env')
            if not path.is_file(): sys.exit('ERROR: .env missing')
            old = path.read_text()
            st = path.stat()
            rows = old.splitlines()
            current = {}
            for row in rows:
                if '=' in row and not row.lstrip().startswith('#'):
                    k, v = row.split('=', 1)
                    current[k.strip()] = v.strip().strip('"\'')
            updates = {
                'BROADCAST_CONNECTION': 'reverb',
                'REVERB_APP_ID': current.get('REVERB_APP_ID') or str(secrets.randbelow(90000000)+10000000),
                'REVERB_APP_KEY': current.get('REVERB_APP_KEY') or secrets.token_hex(16),
                'REVERB_APP_SECRET': current.get('REVERB_APP_SECRET') or secrets.token_hex(32),
                'REVERB_SERVER_HOST': '127.0.0.1',
                'REVERB_SERVER_PORT': port,
                'REVERB_HOST': '127.0.0.1',
                'REVERB_PORT': port,
                'REVERB_SCHEME': 'http',
                'REVERB_ALLOWED_ORIGINS': origins,
            }
            result, seen = [], set()
            for row in rows:
                k = row.split('=',1)[0].strip() if '=' in row and not row.lstrip().startswith('#') else None
                if k in updates:
                    if k not in seen:
                        result.append(f'{k}={updates[k]}')
                        seen.add(k)
                else:
                    result.append(row)
            result += [f'{k}={v}' for k,v in updates.items() if k not in seen]
            if '\n'.join(result)+'\n' == old:
                print('Laravel Reverb .env already correct')
                sys.exit(0)
            backup = pathlib.Path('.env.reverb-backup-'+datetime.now(timezone.utc).strftime('%Y%m%d%H%M%S%f'))
            shutil.copy2(path, backup)
            os.chmod(backup, 0o600)
            fd, tmp = tempfile.mkstemp(prefix='.env.reverb-', dir='.')
            try:
                with os.fdopen(fd,'w') as f: f.write('\n'.join(result)+'\n')
                os.chmod(tmp,st.st_mode & 0o777)
                os.chown(tmp,st.st_uid,st.st_gid)
                os.replace(tmp,path)
            finally:
                if os.path.exists(tmp): os.unlink(tmp)
            print('Laravel Reverb .env updated; backup saved')
            PY
              "$PHP_BIN" artisan optimize:clear
            }

            configure_nginx() {
              local site='/etc/nginx/sites-available/zmedixapi.pulvent.com'
              local snippet='/etc/nginx/snippets/zmedix-reverb.conf'
              if root test -e "$snippet"; then
                root grep -q 'zmedix-managed-reverb-v1' "$snippet" || fail 'Unmanaged Nginx snippet exists'
              fi
              root mkdir -p /etc/nginx/snippets
              root python3 - "$snippet" "$REVERB_PORT" <<'PY'
            import pathlib, shutil, sys
            from datetime import datetime, timezone
            path = pathlib.Path(sys.argv[1])
            port = sys.argv[2]
            new = f'''# zmedix-managed-reverb-v1
            location ^~ /app/ {{
                proxy_pass http://127.0.0.1:{port};
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_read_timeout 3600s;
            }}
            location ^~ /apps/ {{
                proxy_pass http://127.0.0.1:{port};
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }}
            '''
            if path.exists() and path.read_text() == new:
                print('Nginx Reverb snippet already correct')
            else:
                if path.exists():
                    shutil.copy2(path,str(path)+'.bak-'+datetime.now(timezone.utc).strftime('%Y%m%d%H%M%S%f'))
                path.write_text(new)
                print('Nginx Reverb snippet configured')
            PY
              # Previous successful run already inserted the include in the correct HTTPS block.
              root grep -qF 'include /etc/nginx/snippets/zmedix-reverb.conf;' "$site" || fail 'Nginx include absent; not modifying shared Nginx blindly'
              root nginx -t || fail 'Nginx configuration invalid; reload refused'
              root systemctl reload nginx
              echo 'Z-Medix Nginx ready'
            }

            configure_supervisor() {
              local conf='/etc/supervisor/conf.d/zmedix-reverb.conf'
              root python3 - "$conf" "$REVERB_PORT" <<'PY'
            import pathlib, re, shutil, sys
            from datetime import datetime, timezone
            path = pathlib.Path(sys.argv[1]); port=sys.argv[2]
            old = path.read_text()
            pattern = r'(?m)^(command=.+?/artisan reverb:start --host=127\.0\.0\.1 --port=)\d+(\b.*)$'
            if len(re.findall(pattern, old)) != 1:
                sys.exit('ERROR: Unexpected Z-Medix Supervisor command; refusing change')
            new = re.sub(pattern, lambda m: m.group(1)+port+m.group(2), old, count=1)
            if new != old:
                shutil.copy2(path,str(path)+'.bak-'+datetime.now(timezone.utc).strftime('%Y%m%d%H%M%S%f'))
                path.write_text(new)
                print('Z-Medix Supervisor port updated to '+port)
            else: print('Z-Medix Supervisor already uses '+port)
            PY
              root supervisorctl reread
              root supervisorctl update zmedix-reverb
              root grep '^command=' "$conf"
            }

            start_reverb() {
              if running; then
                root supervisorctl restart zmedix-reverb || { diagnose; fail 'Reverb restart failed'; }
              else
                root supervisorctl start zmedix-reverb || { diagnose; fail 'Reverb start failed'; }
              fi
              running || { diagnose; fail 'Reverb not running'; }
              echo "$(status)"
            }

            verify_public() {
              local key
              key="$("$PHP_BIN" -r '
                require "vendor/autoload.php";
                $app = require "bootstrap/app.php";
                $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
                echo config("reverb.apps.apps.0.key");
              ')"
              test -n "$key" || fail 'Reverb app key unavailable'
              python3 - "$WS_HOST" "$key" <<'PY'
            import base64, os, socket, ssl, sys
            host,key=sys.argv[1:]
            wskey=base64.b64encode(os.urandom(16)).decode()
            req=(f'GET /app/{key}?protocol=7&client=js&version=8.4.0 HTTP/1.1\r\n'
                 f'Host: {host}\r\nConnection: Upgrade\r\nUpgrade: websocket\r\n'
                 f'Sec-WebSocket-Version: 13\r\nSec-WebSocket-Key: {wskey}\r\n\r\n')
            try:
                with socket.create_connection((host,443),timeout=10) as raw:
                    with ssl.create_default_context().wrap_socket(raw,server_hostname=host) as sock:
                        sock.settimeout(10)
                        sock.sendall(req.encode())
                        first=sock.recv(512).split(b'\r\n',1)[0].decode(errors='replace')
            except Exception as e:
                sys.exit(f'ERROR: External WebSocket connection failed: {e}')
            if ' 101 ' not in first:
                sys.exit(f'ERROR: External WebSocket handshake returned {first}')
            print('WEBSOCKET_HANDSHAKE=101')
            PY
              echo '=== FRONTEND REVERB CONFIG ==='
              echo "REVERB_APP_KEY=$key"
              echo "REVERB_HOST=$WS_HOST"
              echo 'REVERB_PORT=443'
              echo 'REVERB_SCHEME=https'
              echo 'BROADCAST_AUTH_PATH=/api/student/broadcasting/auth'
              echo 'PRIVATE_CHANNEL=student.ai.conversation.{conversationId}'
              echo 'Never share REVERB_APP_SECRET'
            }

            echo "Action: $ACTION; Server: $(hostname); Project: $APP_PATH"
            case "$ACTION" in
              status) status ;;
              inspect) diagnose; root nginx -t ;;
              stop) if running; then root supervisorctl stop zmedix-reverb; fi; status ;;
              configure-and-start)
                preflight
                configure_nginx
                configure_env
                configure_supervisor
                start_reverb
                # The Queue worker must reload broadcasting configuration.
                if root supervisorctl status zmedix-queue 2>&1 | grep -q RUNNING; then
                  root supervisorctl restart zmedix-queue
                fi
                verify_public
                ;;
              restart) start_reverb; verify_public ;;
              *) fail "Invalid action: $ACTION" ;;
            esac
            echo 'Reverb workflow complete'
            REMOTE
