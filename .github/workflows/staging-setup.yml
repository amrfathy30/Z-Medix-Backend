
name: Staging Setup

on:
  workflow_dispatch:
    inputs:
      action:
        description: Supervisor setup action
        required: true
        default: check
        type: choice
        options:
          - check
          - setup

permissions: {}

concurrency:
  group: zmedix-staging-services
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20

    steps:
      - name: Setup staging services
        uses: appleboy/ssh-action@v1.0.3
        env:
          ACTION: ${{ inputs.action }}
          APP_PATH: ${{ vars.STAGING_APP_PATH || '/var/www/zmedix-backend' }}
          PHP_BIN: ${{ vars.STAGING_PHP_BIN || 'php' }}
          REVERB_PORT: ${{ vars.STAGING_REVERB_INTERNAL_PORT || '8081' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ vars.STAGING_SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 15m
          envs: ACTION,APP_PATH,PHP_BIN,REVERB_PORT
          script: |
            bash -se <<'REMOTE'
            set -euo pipefail

            fail() { echo "ERROR: $*" >&2; exit 1; }

            root() {
              if [ "$(id -u)" -eq 0 ]; then
                "$@"
              else
                sudo -n "$@"
              fi
            }

            case "$ACTION" in
              check|setup) ;;
              *) fail "Invalid action" ;;
            esac

            cd "$APP_PATH" || fail "Application path missing"
            test -f artisan || fail "Laravel not deployed"
            test -f vendor/autoload.php || fail "Composer dependencies missing"

            PHP_BIN="$(command -v "$PHP_BIN")" ||
              fail "PHP not available"

            "$PHP_BIN" -r '
              require "vendor/autoload.php";
              $app = require "bootstrap/app.php";
              $app->make(
                Illuminate\Contracts\Console\Kernel::class
              )->bootstrap();

              if (! $app->environment("local")) {
                fwrite(STDERR, "APP_ENV must be local\n");
                exit(1);
              }

              if (! class_exists(
                Laravel\Reverb\ReverbServiceProvider::class
              )) {
                fwrite(STDERR, "Reverb package missing\n");
                exit(1);
              }
            '

            QUEUE_SETTINGS="$("$PHP_BIN" -r '
              require "vendor/autoload.php";
              $app = require "bootstrap/app.php";
              $app->make(
                Illuminate\Contracts\Console\Kernel::class
              )->bootstrap();

              $connection = config("queue.default");
              $driver = config(
                "queue.connections.{$connection}.driver"
              );

              if (! in_array($driver, ["database", "redis"], true)) {
                exit(1);
              }

              $queues = array_unique([
                config("queue.connections.{$connection}.queue"),
                config("ai_chat.queue")
              ]);

              if (config("ai_chat.queue_connection") !== $connection) {
                exit(1);
              }

              foreach ($queues as $queue) {
                if (! is_string($queue) ||
                    ! preg_match("/^[a-zA-Z0-9_.-]+$/", $queue)) {
                  exit(1);
                }
              }

              if ((int) config(
                "queue.connections.{$connection}.retry_after"
              ) < 90) {
                exit(1);
              }

              echo $connection . "|" . implode(",", $queues);
            ')" || fail "Invalid Queue / AI Chat configuration"

            IFS='|' read -r CONNECTION QUEUES <<< "$QUEUE_SETTINGS"

            [[ "$REVERB_PORT" =~ ^[0-9]+$ ]] ||
              fail "Invalid Reverb port"
            (( REVERB_PORT >= 1 && REVERB_PORT <= 65535 )) ||
              fail "Invalid Reverb port"

            echo "Environment: staging"
            echo "Queue connection: $CONNECTION"
            echo "Queue names: $QUEUES"
            echo "Reverb internal port: $REVERB_PORT"

            if [ "$ACTION" = check ]; then
              if ! command -v supervisorctl >/dev/null; then
                echo "Supervisor not installed"
              else
                root supervisorctl status || true
              fi
              echo "Read-only check complete"
              exit 0
            fi

            if [ "$(id -u)" -ne 0 ]; then
              sudo -n true || fail "Non-interactive sudo required"
            fi

            if ! command -v supervisorctl >/dev/null; then
              command -v apt-get >/dev/null ||
                fail "apt-get required to install Supervisor"
              root apt-get update
              root env DEBIAN_FRONTEND=noninteractive \
                apt-get install -y supervisor
            fi

            root systemctl enable --now supervisor

            mkdir -p storage/logs

            RUN_USER="$(id -un)"
            QUEUE_CONF="/etc/supervisor/conf.d/zmedix-queue.conf"
            REVERB_CONF="/etc/supervisor/conf.d/zmedix-reverb.conf"

            if [ ! -f "$QUEUE_CONF" ]; then
              root tee "$QUEUE_CONF" >/dev/null <<EOF
            [program:zmedix-queue]
            command=${PHP_BIN} ${APP_PATH}/artisan queue:work ${CONNECTION} --queue=${QUEUES} --sleep=3 --tries=3 --backoff=5 --timeout=60 --memory=256 --no-interaction
            directory=${APP_PATH}
            user=${RUN_USER}
            autostart=false
            autorestart=true
            startsecs=5
            stopsignal=TERM
            stopasgroup=true
            killasgroup=true
            stopwaitsecs=120
            redirect_stderr=true
            stdout_logfile=${APP_PATH}/storage/logs/zmedix-queue.log
            stdout_logfile_maxbytes=20MB
            stdout_logfile_backups=5
            EOF
            else
              echo "Queue config exists: preserving it"
            fi

            if [ ! -f "$REVERB_CONF" ]; then
              root tee "$REVERB_CONF" >/dev/null <<EOF
            [program:zmedix-reverb]
            command=${PHP_BIN} ${APP_PATH}/artisan reverb:start --host=127.0.0.1 --port=${REVERB_PORT} --no-interaction
            directory=${APP_PATH}
            user=${RUN_USER}
            autostart=false
            autorestart=true
            startsecs=5
            stopsignal=TERM
            stopasgroup=true
            killasgroup=true
            stopwaitsecs=120
            redirect_stderr=true
            stdout_logfile=${APP_PATH}/storage/logs/zmedix-reverb.log
            stdout_logfile_maxbytes=20MB
            stdout_logfile_backups=5
            EOF
            else
              echo "Reverb config exists: preserving it"
            fi

            root supervisorctl reread
            root supervisorctl update

            echo "=== FINAL SUPERVISOR STATUS ==="
            root supervisorctl status || true

            echo "Setup complete"
            echo "Next: start Queue and configure Reverb separately"
            REMOTE
